[project]
name = "software-delivery-agent"
version = "0.1.0"
description = "Scheduled Sentry triage and approved-ticket implementation through Managed Deep Agents and remote MCP connectors."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.0a8",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.0",
    "managed-deepagents==0.4.0.dev73",
    "pyjwt[crypto]>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.22",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]
